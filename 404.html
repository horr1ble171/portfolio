    .error-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .error-top {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .error-logo {
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: -1px;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(135deg, #fff 0%, #d1d5db 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .error-path {
      max-width: 60vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 8px 14px;
    }
    .error-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px 32px;
    }
    .error-card {
      width: 100%;
      max-width: 640px;
      text-align: center;
      padding: 48px 40px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.6) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15), 0 10px 30px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      animation: error-in 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }
    .error-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, transparent 100%);
      pointer-events: none;
    }
    @keyframes error-in {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #d1d5db;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 8px 18px;
      margin-bottom: 20px;
    }
    .error-badge i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
      display: inline-block;
    }
    .error-code {
      font-size: clamp(5rem, 22vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .error-card h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 800;
      margin: 12px 0 12px;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }
    .error-card p {
      color: #d1d5db;
      line-height: 1.7;
      font-size: 1.05rem;
      max-width: 46ch;
      margin: 0 auto 28px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .error-actions .project-modal-button {
      text-decoration: none;
    }
    .error-actions .project-modal-button--primary {
      background: #fff;
      color: #000;
      border-color: #fff;
      text-shadow: none;
    }
    @media (hover: hover) {
      .error-actions .project-modal-button--primary:hover {
        background: rgba(255, 255, 255, 0.85);
        border-color: #fff;
      }
    }
    .error-links {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .error-links a {
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .error-links a:hover { color: #fff; }
    .error-footer {
      text-align: center;
      padding: 0 16px 32px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.9rem;
    }
    .error-footer a { color: rgba(255, 255, 255, 0.65); text-decoration: none; }
    .error-footer a:hover { color: #fff; }
    @media (max-width: 480px) {
      .error-card { padding: 36px 22px; }
      .error-path { display: none; }
    }
  </style>
</head>

<body class="error-page">
  <div id="silk-container"></div>

  <header class="error-top">
    <a href="/" class="error-logo">horr1ble</a>
    <span class="error-path" id="error-path">/404</span>
  </header>

  <main class="error-wrap">
    <div class="error-card">
      <div class="error-badge"><i></i>Ошибка 404</div>
      <div class="error-code shiny-text">404</div>
      <h1>Страница не найдена</h1>
      <p>Похоже, вы свернули не туда — такой страницы нет или она переехала. Вернитесь на&nbsp;главную или напишите мне напрямую.</p>
      <div class="error-actions">
        <a href="/" class="project-modal-button project-modal-button--primary btn-press">
          <span>На главную</span>
        </a>
        <a href="https://t.me/horr1bl" target="_blank" rel="noopener noreferrer" class="project-modal-button btn-press">
          <span>Написать в Telegram</span>
        </a>
      </div>
      <nav class="error-links">
        <a href="/#skills">Навыки</a>
        <a href="/#projects-section">Проекты</a>
        <a href="/#studio-section">Веб-студия</a>
        <a href="/#contacts">Контакты</a>
      </nav>
    </div>
  </main>

  <footer class="error-footer">© horr1ble · <a href="/">horr1ble.space</a></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script src="/js/silk.js"></script>
  <script>
    (function () {
      try {
        var el = document.getElementById('error-path');
        var p = window.location.pathname + window.location.search;
        if (p && p.length > 1) {
          if (p.length > 60) p = p.slice(0, 60) + '…';
          el.textContent = p;
        } else {
          el.textContent = '/404';
        }
      } catch (e) {}
    })();
  </script>

</html>
