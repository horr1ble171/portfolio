<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Страница не найдена | horr1ble</title>
  <meta name="description" content="Страница не найдена. Вернитесь на главную — портфолио horr1ble: Telegram-боты, сайты и VST3-плагины." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://horr1ble.space/" />
  <meta name="theme-color" content="#000000" />

  <link rel="icon" type="image/png" href="/favicons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
  <link rel="shortcut icon" href="/favicons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
  <link rel="manifest" href="/favicons/site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .error-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }
    .error-card {
      width: 100%;
      max-width: 640px;
      text-align: center;
      padding: 56px 40px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.6) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15), 0 10px 30px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      animation: error-in 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }
    .error-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, transparent 100%);
      pointer-events: none;
    }
    @keyframes error-in {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .error-code {
      font-size: clamp(5rem, 22vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 32px;
    }
    .error-card .project-modal-button {
      text-decoration: none;
    }
    .error-card .project-modal-button--primary {
      background: #fff;
      color: #000;
      border-color: #fff;
      text-shadow: none;
    }
    @media (hover: hover) {
      .error-card .project-modal-button--primary:hover {
        background: rgba(255, 255, 255, 0.85);
        border-color: #fff;
      }
    }
    @media (max-width: 480px) {
      .error-card { padding: 40px 22px; }
    }
  </style>
</head>

<body class="error-page">
  <div id="silk-container"></div>

  <main class="error-wrap">
    <div class="error-card">
      <div class="error-code shiny-text">404</div>
      <a href="/" class="project-modal-button project-modal-button--primary btn-press">
        <span>На главную</span>
      </a>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script src="/js/silk.js"></script>
</body>

</html>
